<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Retrô</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- calculator body -->
    <div class="calculator"> 

<!-- visor -->
        <div class="visor">
            0
        </div>

<!-- keyboard -->
        <div class="keyboard">
            <!-- first line -->
            <button class="special button">C</button>
            <button class="operation button">( )</button>
            <button class="operation button">%</button>
            <button class="operation button">÷</button>

            <!-- second line -->
            <button class="number button">7</button>
            <button class="number button">8</button>
            <button class="number button">9</button>
            <button class="operation button">X</button>

            <!-- third line -->
            <button class="number button">4</button>
            <button class="number button">5</button>
            <button class="number button">6</button>
            <button class="operation button">-</button>

            <!-- forth line -->
            <button class="number button">1</button>
            <button class="number button">2</button>
            <button class="number button">3</button>
            <button class="operation button">+</button>

            <!-- fifth line -->
            <button class="operation button">+/-</button>
            <button class="number button">0</button>
            <button class="operation button">,</button>
            <button class="special button">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
